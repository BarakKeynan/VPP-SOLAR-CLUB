<!DOCTYPE html>
<html lang="he" dir="rtl" id="main-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPP SOLAR CLUB | THE ENERGY SYNDICATE</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00d2ff;
            --accent: #00ff88;
            --bg-dark: #05070a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: #f0f6fc; overflow-x: hidden; }

        /* Hero Strip - השליש העליון */
        .hero {
            height: 100vh;
            min-height: 680px;
            background: linear-gradient(rgba(5,7,10,0.75), rgba(5,7,10,0.85)), 
                        url('https://picsum.photos/id/1015/2000/1200') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
        }

        /* סטריפ הלוגו העליון */
        .top-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.2rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            z-index: 100;
        }

        .logo-text {
            font-family: 'Orbitron';
            font-size: 1.65rem;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(90deg, #00d2ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lang-btn {
            padding: 10px 28px;
            border: 1px solid #00ff88;
            border-radius: 50px;
            background: transparent;
            color: #fff;
            font-family: 'Orbitron';
            cursor: pointer;
            transition: all 0.4s;
        }

        .lang-btn:hover {
            background: #00ff88;
            color: #000;
        }

        .hero-content {
            max-width: 1100px;
            z-index: 10;
        }

        .hero h1 {
            font-family: 'Orbitron';
            font-size: clamp(3.2rem, 7vw, 6rem);
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #00d2ff, #00ff88, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            text-shadow: 0 0 40px rgba(0, 210, 255, 0.5);
        }

        .hero p {
            font-size: 1.5rem;
            opacity: 0.9;
            margin-bottom: 2.5rem;
        }

        .cta-button {
            padding: 18px 55px;
            font-size: 1.4rem;
            font-family: 'Orbitron';
            font-weight: 700;
            background: linear-gradient(90deg, #00ff88, #00cc77);
            color: #000;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0, 255, 136, 0.4);
        }

        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 255, 136, 0.6);
        }
    </style>
</head>
<body>

    <div class="hero">
        <!-- סטריפ עליון עם לוגו רחב -->
        <div class="top-strip">
            <button onclick="toggleLang()" class="lang-btn" id="langBtn">ENGLISH</button>
            <div class="logo-text">VPP SOLAR CLUB</div>
        </div>

        <div class="hero-content">
            <h1>THE ENERGY SYNDICATE</h1>
            <p>Smart Management. Maximum Profit. Clean Energy.</p>
            <button onclick="document.getElementById('register').scrollIntoView({ behavior: 'smooth' })}" class="cta-button">
                Join the Club
            </button>
        </div>
    </div>

    <!-- שאר האתר (Bento, Modals, Form) נשאר כמו בגרסה הקודמת – אם תרצה אשלב גם אותו -->

    <script>
        function toggleLang() {
            const html = document.getElementById('main-html');
            const isHe = html.dir === 'rtl';
            html.dir = isHe ? 'ltr' : 'rtl';
            document.getElementById('langBtn').innerText = isHe ? "עברית" : "ENGLISH";
            // כאן אפשר להוסיף תרגום מלא אם תרצה
        }
    </script>
</body>
</html>
